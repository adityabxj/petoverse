server:
  port: 8080

spring:
  application:
    name: auth-service

  profiles:
    active: docker

  datasource:
    url: jdbc:postgresql://petoverse-postgres:5432/petoverse
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

# ---------------- SECURITY (TEMP) ----------------
  security:
    user:
      name: disabled
      password: disabled


# ---------------- LOGGING ----------------
logging:
  level:
    root: INFO
    com.petoverse: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  file:
    name: logs/auth-service.log

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: logs/auth-service-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB